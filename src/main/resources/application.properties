# Server Configuration
server.port=8080

# Supabase PostgreSQL Configuration (Transaction Pooler)
# Use environment variables if set, otherwise use defaults for local development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:6543/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.wkhtwkyqqusgywwhudta}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:iNGJkCmu04PidWGZ}

# HikariCP Connection Pool Settings - REDUCED FOR SUPABASE FREE TIER
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# CRITICAL FIX: Disable prepared statement caching for Supabase Transaction Mode
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Additional Hibernate optimizations for Transaction Mode
spring.jpa.properties.hibernate.jdbc.batch_size=0
spring.jpa.properties.hibernate.order_inserts=false
spring.jpa.properties.hibernate.order_updates=false
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false